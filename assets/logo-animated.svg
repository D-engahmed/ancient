        <animate attributeName="stdDeviation" values="2;4.5;2" dur="3s" begin="2s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
