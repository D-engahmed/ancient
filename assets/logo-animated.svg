    <g id="gN"><path d="M0 0h10v10h-10z M40 0h10v10h-10z M0 10h20v10h-20z M40 10h10v10h-10z M0 20h10v10h-10z M20 20h10v10h-10z M40 20h10v10h-10z M0 30h10v10h-10z M30 30h20v10h-20z M0 40h10v10h-10z M40 40h10v10h-10z M0 50h10v10h-10z M40 50h10v10h-10z M0 60h10v10h-10z M40 60h10v10h-10z"/></g>
