    <g id="gE"><path d="M0 0h50v10h-50z M0 10h10v10h-10z M0 20h10v10h-10z M0 30h40v10h-40z M0 40h10v10h-10z M0 50h10v10h-10z M0 60h50v10h-50z"/></g>
    <g id="gT"><path d="M0 0h50v10h-50z M20 10h10v10h-10z M20 20h10v10h-10z M20 30h10v10h-10z M20 40h10v10h-10z M20 50h10v10h-10z M20 60h10v10h-10z"/></g>
    <g id="gO"><path d="M10 0h30v10h-30z M0 10h10v10h-10z M40 10h10v10h-10z M0 20h10v10h-10z M40 20h10v10h-10z M0 30h10v10h-10z M40 30h10v10h-10z M0 40h10v10h-10z M40 40h10v10h-10z M0 50h10v10h-10z M40 50h10v10h-10z M10 60h30v10h-30z"/></g>
