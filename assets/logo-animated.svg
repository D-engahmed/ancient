  </g>

  <!-- CODER : teal, pulsing glow, loops every 9s -->
  <g fill="#7FC4BE" filter="url(#glow)">
    <g opacity="0"><use href="#gC" xlink:href="#gC" x="475" y="42"/><animate attributeName="opacity" calcMode="discrete" values="0;1;0;1" keyTimes="0;0.1167;0.1278;0.1389" dur="9s" repeatCount="indefinite"/></g>
