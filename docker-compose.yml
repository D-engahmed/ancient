services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ancient}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ancient_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ancient}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ancient_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ancient_postgres_data:
