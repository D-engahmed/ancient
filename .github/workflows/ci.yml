name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ancient
          POSTGRES_PASSWORD: ancient
          POSTGRES_DB: ancient_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ancient -d ancient_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: postgresql://ancient:ancient@127.0.0.1:5432/ancient_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Apply database migrations
        run: bun run db:migrate

      - name: Typecheck (all packages)
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: Build server
        run: bun run build:server

      - name: Build CLI
        run: bun run build:cli

      - name: Build VS Code extension
        run: bun run build:vscode

      - name: Audit dependencies
        run: bun audit --audit-level=high
